<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAMcam</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #111;
      color: #ccc;
      padding: 16px;
      margin: 0;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.3rem; }
    #modeIndicator { color: #888; font-size: 0.85rem; margin-bottom: 4px; }
    #subtitle { color: #666; font-size: 0.75rem; margin-bottom: 8px; }
    .app-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .canvas-column {
      flex-shrink: 0;
    }
    #canvasWrapper {
      position: relative;
      display: inline-block;
    }
    #canvas {
      display: block;
      cursor: crosshair;
      background: #000;
      image-rendering: pixelated;
    }
    #zoomOverlay {
      display: none;
      position: absolute;
      border: 2px solid rgba(255, 255, 0, 0.7);
      background: rgba(255, 255, 0, 0.1);
      pointer-events: none;
    }
    .action-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      margin-top: 6px;
      font-size: 0.8rem;
      color: #888;
    }
    .stats-row span { display: inline-flex; align-items: center; gap: 4px; }
    .stats-row .label { color: #666; }
    .controls-column {
      flex: 1;
      min-width: 260px;
      max-width: 340px;
    }
    .panel {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .panel h3 {
      margin: 0 0 8px 0;
      font-size: 0.85rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .control-group {
      margin-bottom: 8px;
    }
    .control-group:last-child { margin-bottom: 0; }
    .control-group label {
      display: block;
      font-size: 0.8rem;
      color: #999;
      margin-bottom: 3px;
    }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.85rem;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #666;
    }
    .range-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .range-row input[type="range"] {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
    }
    .range-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #888;
      border-radius: 50%;
      cursor: pointer;
    }
    .range-row .value-display {
      min-width: 50px;
      text-align: right;
      font-size: 0.8rem;
      color: #aaa;
      font-family: monospace;
    }
    .axis-section {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .axis-section .axis-group {
      flex: 1;
    }
    .axis-section label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 2px;
    }
    .initial-values-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .initial-values-grid .dim-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .initial-values-grid .dim-row label {
      font-size: 0.7rem;
      color: #888;
      min-width: 80px;
    }
    .initial-values-grid .dim-row input {
      width: 100%;
    }
    #legendGradient {
      height: 12px;
      border-radius: 3px;
      margin-top: 6px;
    }
    .inline-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .inline-row select { flex: 1; }
    .inline-row button { flex-shrink: 0; }
    #previewPanel {
      display: none;
      flex-shrink: 0;
    }
    #previewPanel.active {
      display: block;
    }
    #previewPanel button {
      margin-top: 4px;
      margin-right: 4px;
      padding: 6px 14px;
      font-size: 0.8rem;
    }
    #previewCanvas, #graphCanvas, #poincareCanvas {
      display: block;
      background: #000;
      margin-top: 8px;
    }
    #pendulumDescription {
      width: 100%;
      height: 80px;
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 6px;
      margin-top: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    #previewStatus {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
    }
    button {
      padding: 8px 20px;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    .hidden { display: none !important; }
  </style>
  <script type="module" crossorigin src="/KAMcam/assets/index-BJ63Thok.js"></script>
</head>
<body>
  <div id="modeIndicator"></div>
  <div id="subtitle"></div>
  <div class="app-layout">
    <div class="canvas-column">
      <div id="canvasWrapper">
        <canvas id="canvas" width="512" height="512"></canvas>
        <div id="zoomOverlay"></div>
      </div>
      <div class="action-row">
        <button id="playBtn">Render</button>
        <button id="zoomOutBtn">Zoom Out</button>
        <button id="resetBtn">Reset Zoom</button>
        <button id="downloadBtn">Download</button>
        <button id="previewToggleBtn">Preview</button>
      </div>
      <div class="stats-row">
        <span id="frameRow"><span class="label">Frame:</span> <span id="frameCount">0</span></span>
        <span id="maxDistRow"><span class="label">Max:</span> <span id="maxDistance">0</span></span>
        <span><span class="label">FPS:</span> <span id="fps">0</span></span>
        <span><span class="label">Zoom:</span> <span id="zoomLevel">1</span></span>
      </div>
    </div>
    <div class="controls-column">
      <div class="panel" id="pendulumMetadata">
        <h3>System</h3>
        <div class="control-group">
          <label>Type</label>
          <select id="systemType">
            <option value="rigid">Rigid Double Pendulum</option>
            <option value="elastic">Elastic Double Pendulum</option>
            <option value="nonlinear">Nonlinear Elastic Pendulum</option>
            <option value="sculpture">Kinetic Sculpture</option>
            <option value="resonant">Resonant Pendulum</option>
          </select>
        </div>
        <div id="doublePendulumParams">
          <div class="control-group">
            <label>Mass 1</label>
            <div class="range-row">
              <input type="range" id="m1" min="0.1" max="10" step="0.1" value="1">
              <span class="value-display" id="m1Value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Mass 2</label>
            <div class="range-row">
              <input type="range" id="m2" min="0.1" max="10" step="0.1" value="1">
              <span class="value-display" id="m2Value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Length 1</label>
            <div class="range-row">
              <input type="range" id="L1" min="0.1" max="5" step="0.1" value="1">
              <span class="value-display" id="L1Value">1.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Length 2</label>
            <div class="range-row">
              <input type="range" id="L2" min="0.1" max="5" step="0.1" value="1">
              <span class="value-display" id="L2Value">1.0</span>
            </div>
          </div>
        </div>
        <div id="elasticControls" class="hidden">
          <div class="control-group">
            <label>Spring Constant 1</label>
            <div class="range-row">
              <input type="range" id="k1" min="1" max="500" step="1" value="50">
              <span class="value-display" id="k1Value">50</span>
            </div>
          </div>
          <div class="control-group">
            <label>Spring Constant 2</label>
            <div class="range-row">
              <input type="range" id="k2" min="1" max="500" step="1" value="50">
              <span class="value-display" id="k2Value">50</span>
            </div>
          </div>
        </div>
        <div id="sculptureControls" class="hidden">
          <div class="control-group">
            <label>Weight</label>
            <div class="range-row">
              <input type="range" id="scWeight" min="10" max="10000" step="10" value="1000">
              <span class="value-display" id="scWeightValue">1000</span>
            </div>
          </div>
          <div class="control-group">
            <label>Rod Length</label>
            <div class="range-row">
              <input type="range" id="scRod" min="1" max="200" step="1" value="50">
              <span class="value-display" id="scRodValue">50.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Axle Radius</label>
            <div class="range-row">
              <input type="range" id="scAxle" min="1" max="50" step="1" value="10">
              <span class="value-display" id="scAxleValue">10.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Reduction Ratio</label>
            <div class="range-row">
              <input type="range" id="scReduction" min="0.01" max="1" step="0.01" value="0.1">
              <span class="value-display" id="scReductionValue">0.10</span>
            </div>
          </div>
          <div class="control-group">
            <label>Levels</label>
            <select id="scN">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
            </select>
          </div>
        </div>
        <div id="resonantControls" class="hidden">
          <div class="control-group">
            <label>Mass 0</label>
            <div class="range-row">
              <input type="range" id="rpM0" min="10" max="10000" step="10" value="1000">
              <span class="value-display" id="rpM0Value">1000</span>
            </div>
          </div>
          <div class="control-group">
            <label>Mass 1</label>
            <div class="range-row">
              <input type="range" id="rpM1" min="10" max="10000" step="10" value="100">
              <span class="value-display" id="rpM1Value">100</span>
            </div>
          </div>
          <div class="control-group">
            <label>Length 0</label>
            <div class="range-row">
              <input type="range" id="rpL0" min="1" max="200" step="1" value="50">
              <span class="value-display" id="rpL0Value">50.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Length 1</label>
            <div class="range-row">
              <input type="range" id="rpL1" min="1" max="200" step="1" value="10">
              <span class="value-display" id="rpL1Value">10.0</span>
            </div>
          </div>
          <div class="control-group">
            <label>Axle Offset</label>
            <div class="range-row">
              <input type="range" id="rpA0" min="1" max="50" step="1" value="10">
              <span class="value-display" id="rpA0Value">10.0</span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" id="phaseSpacePanel">
        <h3>Phase Space</h3>
        <div class="axis-section">
          <div class="axis-group">
            <label>X Axis</label>
            <select id="xDimension">
              <option value="angle1">theta1</option>
              <option value="velocity1">omega1</option>
              <option value="angle2">theta2</option>
              <option value="velocity2">omega2</option>
              <option value="stretch1">r1</option>
              <option value="stretchRate1">rdot1</option>
              <option value="stretch2">r2</option>
              <option value="stretchRate2">rdot2</option>
            </select>
          </div>
          <div class="axis-group">
            <label>Y Axis</label>
            <select id="yDimension">
              <option value="angle1">theta1</option>
              <option value="velocity1">omega1</option>
              <option value="angle2" selected>theta2</option>
              <option value="velocity2">omega2</option>
              <option value="stretch1">r1</option>
              <option value="stretchRate1">rdot1</option>
              <option value="stretch2">r2</option>
              <option value="stretchRate2">rdot2</option>
            </select>
          </div>
        </div>
        <div class="axis-section">
          <div class="axis-group">
            <label>X Min</label>
            <input type="number" id="xMin" step="0.1" value="-3.14">
          </div>
          <div class="axis-group">
            <label>X Max</label>
            <input type="number" id="xMax" step="0.1" value="3.14">
          </div>
          <div class="axis-group">
            <label>Y Min</label>
            <input type="number" id="yMin" step="0.1" value="-3.14">
          </div>
          <div class="axis-group">
            <label>Y Max</label>
            <input type="number" id="yMax" step="0.1" value="3.14">
          </div>
        </div>
        <div class="initial-values-grid">
          <div class="dim-row" data-dim="angle1"><label>theta1</label><input type="number" id="initAngle1" step="0.1" value="0"></div>
          <div class="dim-row" data-dim="velocity1"><label>omega1</label><input type="number" id="initVelocity1" step="0.1" value="0"></div>
          <div class="dim-row" data-dim="angle2"><label>theta2</label><input type="number" id="initAngle2" step="0.1" value="0"></div>
          <div class="dim-row" data-dim="velocity2"><label>omega2</label><input type="number" id="initVelocity2" step="0.1" value="0"></div>
          <div class="dim-row" data-dim="stretch1"><label>r1</label><input type="number" id="initStretch1" step="0.01" value="0"></div>
          <div class="dim-row" data-dim="stretchRate1"><label>rdot1</label><input type="number" id="initStretchRate1" step="0.1" value="0"></div>
          <div class="dim-row" data-dim="stretch2"><label>r2</label><input type="number" id="initStretch2" step="0.01" value="0"></div>
          <div class="dim-row" data-dim="stretchRate2"><label>rdot2</label><input type="number" id="initStretchRate2" step="0.1" value="0"></div>
        </div>
        <div class="control-group" style="margin-top: 10px;">
          <label>Slice Mode</label>
          <select id="sliceMode">
            <option value="manual">Manual</option>
            <option value="tiling">Tiling</option>
          </select>
        </div>
        <div id="tilingControls" class="hidden">
          <div class="inline-row">
            <div class="control-group">
              <label>Cols</label>
              <input type="number" id="tileCols" min="1" max="10" value="3">
            </div>
            <div class="control-group">
              <label>Rows</label>
              <input type="number" id="tileRows" min="1" max="10" value="2">
            </div>
            <button id="regenerateTilesBtn">Regenerate</button>
          </div>
        </div>
      </div>
      <div class="panel" id="integrationPanel">
        <h3>Integration</h3>
        <div class="control-group">
          <label>Time Step (dt)</label>
          <input type="number" id="dt" step="0.0001" value="0.002">
        </div>
        <div class="control-group">
          <label>Iterations / Frame</label>
          <div class="range-row">
            <input type="range" id="iterations" min="1" max="100" step="1" value="10">
            <span class="value-display" id="iterValue">10</span>
          </div>
        </div>
        <div class="control-group">
          <label>Max Iterations</label>
          <input type="number" id="maxIter" step="100" value="5000">
        </div>
        <div id="perturbControl" class="hidden">
          <div class="control-group">
            <label>Perturbation</label>
            <div class="range-row">
              <input type="range" id="perturb" min="0.000001" max="0.1" step="0.000001" value="0.00001">
              <span class="value-display" id="perturbValue">0.000010</span>
            </div>
          </div>
        </div>
        <div id="perturbModeControl" class="hidden">
          <div class="control-group">
            <label>Distribution</label>
            <select id="perturbDistribution">
              <option value="uniform">Uniform</option>
              <option value="gaussian">Gaussian</option>
            </select>
          </div>
        </div>
        <div id="trialsControl" class="hidden">
          <div class="control-group">
            <label>Trials</label>
            <div class="range-row">
              <input type="range" id="trials" min="1" max="64" step="1" value="1">
              <span class="value-display" id="trialsValue">1</span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" id="visualizationPanel">
        <h3>Visualization</h3>
        <div class="control-group">
          <label>Mode</label>
          <select id="vizMode">
            <option value="distance">Bob2 Distance</option>
            <option value="divergence">Divergence Time</option>
            <option value="divergenceDistance">Divergence Distance</option>
            <option value="position">Pendulum Position</option>
            <option value="neighborDistance">Neighbor Distance</option>
            <option value="neighborDistanceAccumulated">Accumulated Neighbor Dist</option>
          </select>
        </div>
        <div class="control-group">
          <label>Colormap</label>
          <select id="colormap">
            <option value="0">Viridis</option>
            <option value="1">Magma</option>
            <option value="2">Plasma</option>
            <option value="3">Inferno</option>
            <option value="4">Turbo</option>
            <option value="5">Jet</option>
            <option value="6" selected>Rainbow</option>
          </select>
        </div>
        <div id="legendGradient"></div>
        <div class="control-group">
          <label>Tone Mapping</label>
          <select id="toneMapping">
            <option value="0" selected>Linear</option>
            <option value="1">Logarithmic</option>
            <option value="2">Square Root</option>
            <option value="3">S-Curve</option>
          </select>
        </div>
        <div class="control-group">
          <label>Resolution</label>
          <select id="resolution">
            <option value="256">256</option>
            <option value="512" selected>512</option>
            <option value="1024">1024</option>
          </select>
        </div>
      </div>
    </div>
    <div id="previewPanel">
      <div id="playbackControls" style="display:none;">
        <button id="playPauseBtn">Pause</button>
        <button id="savePeriodBtn">Copy Description</button>
      </div>
      <canvas id="previewCanvas" width="500" height="500"></canvas>
      <canvas id="graphCanvas" width="500" height="200"></canvas>
      <canvas id="poincareCanvas" width="500" height="300"></canvas>
      <textarea id="pendulumDescription" readonly></textarea>
      <div id="previewStatus">Click map to sample initial condition</div>
    </div>
  </div>
</body>
</html>
