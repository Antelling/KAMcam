<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAMcam</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #ccc;
      padding: 16px;
      margin: 0;
    }
    h1 {
      margin: 0 0 8px 0;
    }
    #canvas {
      display: inline-block;
      cursor: crosshair;
      background: #000;
      image-rendering: pixelated;
    }
    #status {
      font-size: 0.85rem;
      color: #888;
      margin-top: 8px;
    }
    button {
      padding: 8px 20px;
      margin-top: 8px;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background: #444;
    }
    .main-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .main-panel {
      flex-shrink: 0;
    }
    #previewPanel {
      display: none;
      flex-shrink: 0;
    }
    #previewPanel.active {
      display: block;
    }
    #previewPanel button {
      margin-top: 4px;
      margin-right: 4px;
      padding: 6px 14px;
      font-size: 0.8rem;
    }
    #previewCanvas, #graphCanvas, #poincareCanvas {
      display: block;
      background: #000;
      margin-top: 8px;
    }
    #pendulumDescription {
      width: 100%;
      height: 80px;
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.75rem;
      padding: 6px;
      margin-top: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    #previewStatus {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>KAMcam</h1>
  <div class="main-layout">
    <div class="main-panel">
      <canvas id="canvas" width="512" height="512"></canvas>
      <br>
      <button id="playBtn">Play</button>
      <button id="previewToggleBtn">Preview</button>
      <div id="status">Initializing...</div>
    </div>
    <div id="previewPanel">
      <div id="playbackControls" style="display:none;">
        <button id="playPauseBtn">Pause</button>
        <button id="savePeriodBtn">Copy Description</button>
      </div>
      <canvas id="previewCanvas" width="500" height="500"></canvas>
      <canvas id="graphCanvas" width="500" height="200"></canvas>
      <canvas id="poincareCanvas" width="500" height="300"></canvas>
      <textarea id="pendulumDescription" readonly></textarea>
      <div id="previewStatus">Click map to sample initial condition</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
