<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAMcam</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #ccc;
      padding: 16px;
      margin: 0;
    }
    h1 {
      margin: 0 0 8px 0;
    }
    #canvas {
      display: inline-block;
      cursor: crosshair;
      background: #000;
      image-rendering: pixelated;
    }
    #status {
      font-size: 0.85rem;
      color: #888;
      margin-top: 8px;
    }
    button {
      padding: 8px 20px;
      margin-top: 8px;
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>KAMcam</h1>
  <canvas id="canvas" width="512" height="512"></canvas>
  <br>
  <button id="playBtn">Play</button>
  <div id="status">Initializing...</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
